name: PR TO MAIN

on:
  push:
    branches: ['release', 'release/**']

permissions:
  contents: read
  id-token: write

jobs:
  ci-dot-net:
    uses: vyracare/vyracare-infra-pipes-dot-net/.github/workflows/ci-generic-dot-net.yml@main
    with:
      branch-name: ${{ github.ref_name }}
      project-path: Vyracare.Api.Appointments.csproj
      test-project-path: Vyracare.Api.Appointments.Tests/Vyracare.Api.Appointments.Tests.csproj
      output-dir: ./publish
    secrets: inherit

  publish-hml:
    needs: ci-dot-net
    uses: vyracare/vyracare-infra-pipes-dot-net/.github/workflows/cd-generic-dot-net.yml@main
    with:
      branch-name: ${{ github.ref_name }}
      backend-repo: ${{ github.repository }}
      project-path: Vyracare.Api.Appointments.csproj
      output-dir: backend-publish
      api-gateway-name: vyracare-api-appointments
      lambda-function-name: vyracare-api-appointments
      lambda-handler: Vyracare.Api.Appointments
      route-base-path: api/appointments
    secrets: inherit

  open-pr-main:
    runs-on: ubuntu-latest
    needs: publish-hml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}
      - uses: repo-sync/pull-request@v2
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          source_branch: ${{ github.ref_name }}
          destination_branch: main
          pr_title: "PR automatic ${{ github.ref_name }} into main"
          pr_body: "PR automatica criada pelo pipeline."
