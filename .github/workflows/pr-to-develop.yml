name: PR TO DEVELOP

on:
  push:
    branches: ['feat/*', 'fix/*', 'feature/*']

jobs:
  ci-dot-net:
    uses: vyracare/vyracare-infra-pipes-dot-net/.github/workflows/ci-generic-dot-net.yml@main
    with:
      branch-name: ${{ github.ref_name }}
      project-path: Vyracare.Api.Appointments.csproj
      test-project-path: Vyracare.Api.Appointments.Tests/Vyracare.Api.Appointments.Tests.csproj
      output-dir: ./publish
    secrets: inherit

  open-pr-develop:
    runs-on: ubuntu-latest
    needs: ci-dot-net
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.PAT_TOKEN }}
      - uses: repo-sync/pull-request@v2
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          source_branch: ${{ github.ref_name }}
          destination_branch: develop
          pr_title: "PR automatic ${{ github.ref_name }} into develop"
          pr_body: "PR automatica criada pelo pipeline."
